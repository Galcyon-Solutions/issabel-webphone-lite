# kit-unit: webphone
# kit-webphone-wrap.conf - envoltorio transparente del webphone (etapa 4). Archivo PROPIO en /etc/httpd/conf.d/: no
# toca ninguna conf de otros ni el vhost de ssl.conf. Lo instala y lo quita install.sh --envoltorio (y uninstall.sh).
#
# Que hace: cuando el NAVEGADOR pide un DOCUMENTO de nivel superior (Sec-Fetch-Dest: document) por GET a "/" o a
# "/index.php", Apache responde con la pagina estatica del envoltorio (barra del webphone arriba y la URL original en un
# iframe debajo) en lugar de index.php. TODO lo demas pasa sin tocar: iframe, empty, script, style, image, etc.; POST;
# rawmode=yes; descargas y exportaciones (action=...download/export); cualquier otra ruta (/admin/, /modules/, /libs/,
# /vtigercrm/, /kit-ws, ...); y cualquier peticion sin la cabecera Sec-Fetch-Dest (curl, monitoreo, navegadores viejos).
# Mientras exista la cookie wp_nowrap=1 tampoco envuelve (la fija el propio envoltorio cuando esta cuenta no tiene webphone).
#
# Por que <Directory> y no el contexto del servidor: las reglas RewriteRule del servidor principal NO las hereda el
# vhost _default_:443 de ssl.conf (haria falta RewriteOptions Inherit dentro de ese vhost, que no se toca). Las secciones
# <Directory> si se fusionan en todos los vhosts. Reescribir por directorio exige Options FollowSymLinks.
#
# Como la misma URL devuelve contenido distinto segun una cabecera, la respuesta del envoltorio lleva
# "Vary: Sec-Fetch-Dest" y "Cache-Control: no-store"; la respuesta normal de "/" y "/index.php" lleva el mismo Vary.
<IfModule mod_rewrite.c>
<Directory "/var/www/html">
    Options +FollowSymLinks
    RewriteEngine On
    # Issabel ya tiene en este mismo <Directory> (issabel.conf) la regla que manda HTTP a HTTPS. Sin Inherit, las reglas de
    # esta seccion REEMPLAZAN a las de la anterior; con Inherit se conservan (las de aqui van primero).
    RewriteOptions Inherit
    # Solo por HTTPS (por HTTP manda la regla de Issabel que redirige a HTTPS, aunque el navegador mande Sec-Fetch-*)
    RewriteCond %{HTTPS} on
    # Solo GET (el POST del login y de los formularios nunca se envuelve)
    RewriteCond %{REQUEST_METHOD} =GET
    # Solo la navegacion de documento del navegador. Sin la cabecera: no se envuelve.
    RewriteCond %{HTTP:Sec-Fetch-Dest} =document
    # Cuenta sin webphone (cookie corta que fija el envoltorio al desenvolver)
    RewriteCond %{HTTP_COOKIE} !(^|;\s*)wp_nowrap=1(;|$)
    # Respuestas que no son una pagina: modo "raw" del framework, descargas y exportaciones
    RewriteCond %{QUERY_STRING} !(^|&)rawmode=yes(&|$) [NC]
    RewriteCond %{QUERY_STRING} !(^|&)(action|accion)=[^&]*(download|export|descarg) [NC]
    # Si el modulo ya no esta (reversa a medias) no se envuelve nada
    RewriteCond %{DOCUMENT_ROOT}/modules/webphone_kit/shell/wrap.html -f
    RewriteRule ^(index\.php)?$ /modules/webphone_kit/shell/wrap.html [L]
</Directory>
</IfModule>

<IfModule mod_headers.c>
<Location "/modules/webphone_kit/shell/wrap.html">
    Header always set Cache-Control "no-store"
    Header always merge Vary "Sec-Fetch-Dest"
</Location>
<LocationMatch "^/(index\.php)?$">
    Header always merge Vary "Sec-Fetch-Dest"
</LocationMatch>
</IfModule>
