<html>
<head>

<title>Issabel</title>

<script src="/modules/webphone_kit/themes/default/js/webphone.js" defer></script>

</head>
<body>
<div id="wpk-shell-bar"></div>
<iframe id="wpk-shell-frame" title="Issabel" sandbox="allow-same-origin allow-scripts allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-downloads"></iframe>

</body>
</html>
